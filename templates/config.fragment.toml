# Merge these keys into the matching sections of ~/.codex/config.toml.
# DO NOT append duplicate [features] or [agents] tables. DO NOT replace the
# user's complete config.toml.

# Parent-thread default: Sol keeps framing, authority, decisions, review, and
# final acceptance in one place.
model = "gpt-5.6-sol"
model_reasoning_effort = "high"

[features]
# Stable multi-agent collaboration tools.
multi_agent = true

[agents]
enabled = true
# Capacity ceiling, not a target. Prefer the minimum useful number of native
# subagents.
max_concurrent_threads_per_session = 10
default_subagent_model = "gpt-5.6-terra"
default_subagent_reasoning_effort = "high"
