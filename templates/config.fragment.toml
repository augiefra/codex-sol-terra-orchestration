# Merge these keys into the matching sections of ~/.codex/config.toml.
# DO NOT append duplicate [features] or [agents] tables. DO NOT replace the
# user's complete config.toml.

# Parent-thread default: Sol keeps framing, authority, decisions, review, and
# final acceptance in one place.
model = "gpt-5.6-sol"
model_reasoning_effort = "ultra"

[features]
# Stable multi-agent collaboration tools and the opt-in V2 runtime that lets
# collaborative Sol/Terra agents delegate to supported leaf models such as
# Luna. Both switches are intentionally explicit for auditability.
multi_agent = true
multi_agent_v2 = true

[agents]
enabled = true
# Capacity ceiling, not a target. Prefer the minimum useful number of native
# subagents. Unpinned children are Luna Max leaves; select Terra High
# explicitly only for a collaborative branch.
max_concurrent_threads_per_session = 8
default_subagent_model = "gpt-5.6-luna"
default_subagent_reasoning_effort = "max"
